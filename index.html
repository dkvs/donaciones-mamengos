<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doná a Los Gatos Mamengos</title><style>body{font-family:system-ui,sans-serif;background:#fff9ee;color:#242424;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px;box-sizing:border-box}.card{background:white;border:1px solid #eee0c9;border-radius:22px;padding:32px 22px;max-width:420px;width:100%;box-sizing:border-box;text-align:center;box-shadow:0 8px 28px #0000000c}h1{font-size:27px;margin:8px 0 12px}p{line-height:1.5}.alias{display:flex;align-items:center;gap:8px;background:#f7f7f7;border-radius:12px;padding:10px;margin:24px 0}.alias span{flex:1;font-size:17px;font-weight:700;overflow-wrap:anywhere}button{border:0;border-radius:10px;background:#ffe066;padding:12px 14px;font-weight:700;font-size:15px;cursor:pointer}.hint{font-size:14px;color:#555}</style></head><body><main class="card"><div style="font-size:45px">🐈❤️</div><h1>Los Gatos Mamengos</h1><p>Tu donación ayuda a alimentar y cuidar a gatos rescatados.</p><p><strong>Alias para transferir por Mercado Pago o tu banco:</strong></p><div class="alias"><span id="alias">gatos.mamengos.mp</span><button id="copy" type="button" onclick="copyAlias()">📋 Copiar</button></div><p class="hint" id="status" role="status">Copiá el alias, abrí Mercado Pago, elegí Transferir y pegalo.</p><p>¡Cada aporte cuenta! 🐾</p></main><script>async function copyAlias(){const value='gatos.mamengos.mp';try{await navigator.clipboard.writeText(value);document.getElementById('copy').textContent='✓ Copiado';document.getElementById('status').textContent='¡Alias copiado! Ahora pegalo en Mercado Pago.'}catch(e){const t=document.createElement('textarea');t.value=value;document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();document.getElementById('status').textContent=ok?'¡Alias copiado! Ahora pegalo en Mercado Pago.':'Mantené presionado el alias para copiarlo.'}} </script></body></html>
